<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Peru – Raumanalyse</title>
<style>
  :root{
    --blue:#4dabf7;
    --blue-light:#e7f5ff;
    --sea-base:#e7f8ff;
    --sea-hover:#d0efff;
    --sea-active:#4dabf7;
    --gray-base:#f3f4f6;
    --gray-hover:#e0e3e6;
    --gray-active:#adb5bd;
    --sand:#ffd43b;
    --green:#69db7c;
    --green-light:#d3f9d8;
    --jungle:#2f9e44;
  }

  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--gray-base);color:#222}
  h1{text-align:center;margin:18px 0}
  #layout{display:grid;grid-template-columns:60% 40%;gap:14px;max-width:1200px;margin:auto;padding:14px}
  #map-container,#info-panel{background:#fff;border-radius:12px;padding:14px;box-shadow:0 8px 22px rgba(0,0,0,0.08)}
  object{width:100%;height:640px;border:0;display:block}
  .section{margin-bottom:14px}
  .section h2{margin:0 0 6px;color:var(--blue);font-size:16px}
  .section p,.section li{font-size:14px;line-height:1.45}
  .section ul{padding-left:18px;margin:6px 0 0 0}
  .note{font-style:italic;color:#666}

  /* klickbare begriffe im Text */
  .term-btn{
    display:inline-block;border:0;background:transparent;padding:0;margin:0 2px;font-weight:700;color:inherit;cursor:pointer;text-decoration:underline dotted;
  }
  .term-btn:focus{outline:2px solid rgba(0,0,0,0.08);border-radius:3px}

  /* MODAL STYLES */
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;z-index:9999}
  .modal{background:#fff;border-radius:10px;padding:20px;max-width:600px;width:90%;box-shadow:0 14px 40px rgba(0,0,0,0.25); animation: fadeIn 0.2s ease-out;}
  .modal h3{margin:0 0 10px; color: var(--blue); font-size: 1.2rem;}
  .modal p{margin:0 0 15px; line-height: 1.5;}
  .modal .close{display:inline-block;padding:8px 16px;border-radius:6px;background:var(--blue);color:#fff;border:0;cursor:pointer;font-weight:bold;}
  .modal .close:hover{background:#3b8dc4;}

  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  footer{font-size:12px;color:#666;margin-top:8px}
  @media (max-width:900px){#layout{grid-template-columns:1fr} object{height:520px}}
</style>
</head>
<body>
<h1>Peru – Raumanalyse</h1>

<div id="layout">
  <div id="map-container">
    <object id="map-object" data="map.svg" type="image/svg+xml"></object>
  </div>

  <div id="info-panel">
    <div class="section">
      <h2>Region</h2>
      <p id="region-name" class="note">Bitte eine Region anklicken (STRG für Mehrfachauswahl)</p>
    </div>

    <div class="section">
      <h2>Fakten</h2>
      <div id="facts">—</div>
    </div>

    <div class="section">
      <h2>Naturraum & Entwicklung</h2>
      <div id="nature">—</div>
    </div>

    <div class="section">
      <h2>Gesellschaft & Politik</h2>
      <div id="society">—</div>
    </div>

    <div class="section">
      <h2>Weltwirtschaft</h2>
      <div id="world">—</div>
    </div>

    <div class="section">
      <h2>Disparitäten & Probleme</h2>
      <div id="problems">—</div>
    </div>

    <footer>Projekt: Raumanalyse Peru von Lasse, Leon, Lille und Mark</footer>
  </div>
</div>

<div id="term-modal-container" style="display:none"></div>

<script>
/* ============================================================
   1. BEGRIFFE (Text-Links)
   ============================================================ */
const TERMS = {
  "Bad Governance": "Schlechte Regierungsführung: Staatliche Institutionen funktionieren nicht effizient oder gerecht; es fehlen Transparenz, Rechenschaftspflicht und langfristige Planung.",
  "Korruption": "Missbrauch anvertrauter Macht zum privaten Vorteil. In Peru ein großes strukturelles Problem, das Gelder für Entwicklungsprojekte verschwinden lässt.",
  "Subsistenzwirtschaft": "Wirtschaftsform, bei der fast ausschließlich für den eigenen Bedarf produziert wird (Selbstversorgung). Überschüsse für den Verkauf gibt es kaum.",
  "Terms of Trade": "Das Verhältnis von Export- zu Importpreisen. Da Peru Rohstoffe exportiert und Fertigwaren importiert, muss es immer mehr Rohstoffe verkaufen, um die gleichen Waren zu importieren.",
  "Fragmentierung": "Räumliche Zersplitterung. In Peru sind Küste (entwickelt) und Hochland/Urwald (unterentwickelt) kaum vernetzt, was den landesweiten Fortschritt hemmt.",
  "Landflucht": "Die massive Abwanderung von Menschen aus den ländlichen Gebieten (Sierra/Selva) in die großen Städte an der Küste, vor allem nach Lima."
};

/* ============================================================
   2. SYMBOL-ERKLÄRUNGEN (für Klick auf SVG-Icons)
   IDs in SVG müssen Format haben: "symbol-mining-sierra", "symbol-agri-costa" etc.
   Der Teil nach 'symbol-' bestimmt den Text.
   ============================================================ */
const SYMBOL_DEFINITIONS = {
  "mining": {
    title: "Bergbau & Rohstoffe",
    text: "Der Bergbau ist das Rückgrat der peruanischen Wirtschaft. In den Anden werden riesige Mengen an Kupfer, Gold, Zink und Silber abgebaut. Dies bringt Devisen, verursacht aber oft massive Umweltschäden und Konflikte mit der lokalen Bevölkerung."
  },
  "agri": {
    title: "Landwirtschaft",
    text: "An der Küste dominiert moderne Exportlandwirtschaft (Spargel, Avocados) durch künstliche Bewässerung. In den Anden herrscht traditionelle Subsistenzwirtschaft (Kartoffeln, Mais) vor, während im Amazonasgebiet teils Plantagenwirtschaft betrieben wird."
  },
  "fish": {
    title: "Fischerei",
    text: "Dank des kalten Humboldtstroms ist die peruanische Küste extrem fischreich. Peru ist weltweit führend in der Produktion von Fischmehl. Überfischung und das El-Niño-Phänomen sind jedoch ständige Risiken."
  },
  "oil": {
    title: "Erdöl & Gas",
    text: "Vor allem im Amazonasbecken (Selva) und im Norden der Küste wird Öl und Gas gefördert. Dies führt oft zu Verschmutzung von Flüssen und Konflikten mit indigenen Völkern."
  },
  "ind": {
    title: "Industrie",
    text: "Die Industrie konzentriert sich stark auf Lima und die Küstenstädte. Es dominiert die Verarbeitung von Rohstoffen (Textilien, Lebensmittel, Fischmehl). Hochtechnologie ist noch gering vertreten."
  },
  "city": {
    title: "Urbanisierung / Stadt",
    text: "Symbole für urbane Zentren. Die Küste ist hochgradig verstädtert. Lima allein beherbergt rund ein Drittel der Gesamtbevölkerung, was zu enormem Druck auf Wasserversorgung und Wohnraum führt."
  },
  "tourist": {
    title: "Tourismus",
    text: "Wichtiger Wirtschaftszweig. Hauptziele sind Cusco/Machu Picchu (Sierra) und zunehmend der Ökotourismus im Amazonas. Bringt Devisen, aber Gefahr von 'Overtourism'."
  },
  // Fallback für Symbole, die wir nicht kennen
  "default": {
    title: "Wirtschaftliches Symbol",
    text: "Dieses Symbol kennzeichnet eine wichtige wirtschaftliche oder infrastrukturelle Aktivität in dieser Region."
  }
};

/* ============================================================
   3. REGIONEN DATEN
   ============================================================ */
const REGION_DATA = {
  peru: {
    name: "Peru (Gesamt)",
    facts: `<ul><li><strong>Hauptstadt:</strong> Lima.</li><li><strong>Einwohner:</strong> ca. 34 Mio.</li><li><strong>BIP:</strong> Stark abhängig vom Export.</li></ul>`,
    nature: `<ul><li>Extreme geographische Dreiteilung (Costa, Sierra, Selva).</li><li>Hohes Risiko durch Naturkatastrophen (El Niño, Erdbeben).</li></ul>`,
    society: `<ul><li>Starke soziale Ungleichheit (Gini-Koeffizient).</li><li>Kulturelle Vielfalt, aber Diskriminierung indigener Gruppen.</li></ul>`,
    world: `<ul><li>Rohstofflieferant für den Weltmarkt (China, USA).</li><li>Mitglied der APEC und Pazifik-Allianz.</li></ul>`,
    problems: `<ul><li>Strukturelle <button class="term-btn" data-term="Korruption">Korruption</button>.</li><li>Abhängigkeit von volatilen Rohstoffpreisen.</li></ul>`
  },
  costa: {
    name: "Costa (Küste)",
    facts: `<ul><li>Nur ca. 11% der Fläche, aber über 50% der Bevölkerung.</li><li>Wirtschaftliches und politisches Machtzentrum.</li></ul>`,
    nature: `<ul><li>Wüstenklima durch kalten Humboldtstrom.</li><li>Wasser ist der limitierende Faktor.</li></ul>`,
    society: `<ul><li>Moderner Lebensstil, aber große Slums (Pueblos Jóvenes).</li><li>Zielgebiet der <button class="term-btn" data-term="Landflucht">Landflucht</button>.</li></ul>`,
    world: `<ul><li>Häfen für den Welthandel (Callao).</li><li>Agrarexporte (Blaubeeren, Spargel).</li></ul>`,
    problems: `<ul><li>Wasserknappheit.</li><li>Verkehrskollaps in Lima.</li></ul>`
  },
  sierra: {
    name: "Sierra (Anden)",
    facts: `<ul><li>Bevölkerung lebt oft in isolierten Tälern.</li><li>Bergbauzentren vs. arme Bauerndörfer.</li></ul>`,
    nature: `<ul><li>Höhenzüge bis über 6000m.</li><li>Klimawandel bedroht Gletscher (Wasserspeicher).</li></ul>`,
    society: `<ul><li>Stark indigene Prägung (Quechua, Aymara).</li><li>Hohe Armutsrate und <button class="term-btn" data-term="Subsistenzwirtschaft">Subsistenzwirtschaft</button>.</li></ul>`,
    world: `<ul><li>Herkunft der meisten Export-Metalle.</li></ul>`,
    problems: `<ul><li>Schlechte Infrastruktur (Straßen, Schulen).</li><li>Umweltzerstörung durch Bergbau.</li></ul>`
  },
  selva: {
    name: "Selva (Amazonas)",
    facts: `<ul><li>Ca. 60% der Landesfläche, aber nur dünn besiedelt.</li><li>Iquitos ist die größte Stadt der Welt ohne Straßenanbindung.</li></ul>`,
    nature: `<ul><li>Tropischer Regenwald, enorme Biodiversität.</li><li>Global wichtig als CO2-Senke.</li></ul>`,
    society: `<ul><li>Viele indigene Stämme, teils unkontaktiert.</li><li>Konflikte mit illegalen Holzfällern und Goldsuchern.</li></ul>`,
    world: `<ul><li>Interesse an Tropenholz und Ölreserven.</li></ul>`,
    problems: `<ul><li>Illegale Abholzung und Drogenanbau (Koka).</li><li>Quecksilberverseuchung der Flüsse.</li></ul>`
  },
  sea: {
    name: "Mar Grau (Pazifik)",
    facts:`<ul><li>200-Meilen-Zone.</li><li>Eines der produktivsten Meeresökosysteme der Welt.</li></ul>`,
    nature:`<ul><li>Nährstoffreichtum durch Auftriebswasser (Upwelling).</li></ul>`,
    society:`<ul><li>Fischerei als wichtiger Arbeitgeber.</li></ul>`,
    world:`<ul><li>Globaler Hauptproduzent von Fischmehl.</li></ul>`,
    problems:`<ul><li>Überfischung und Plastikmüll.</li></ul>`
  },
  other: {
    name: "Nachbarländer",
    facts:`<ul><li>Grenzen zu Ecuador, Kolumbien, Brasilien, Bolivien, Chile.</li></ul>`,
    nature:`<ul><li>Grenzüberschreitende Ökosysteme (Amazonas, Anden).</li></ul>`,
    society:`<ul><li>Migration (z.B. aus Venezuela).</li></ul>`,
    world:`<ul><li>Regionale Integration oft schwierig.</li></ul>`,
    problems:`<ul><li>Schmuggel und unkontrollierte Grenzen.</li></ul>`
  }
};

/* ============================================================
   LOGIK & INTERAKTION
   ============================================================ */
const COLORS = {
  costa: { base:"rgba(0,0,0,0.01)", hover:"#fff3bf", active:"#ffd43b" },
  sierra:{ base:"rgba(0,0,0,0.01)", hover:"#d3f9d8", active:"#69db7c" },
  selva: { base:"rgba(0,0,0,0.01)", hover:"#c3fae8", active:"#2f9e44" },
  peru:  { base:"#ffffff", hover:"#e7f5ff", active:"#4dabf7" },
  sea:   { base:"#e7f8ff", hover:"#d0efff", active:"#4dabf7" },
  other: { base:"#f3f4f6", hover:"#e0e3e6", active:"#adb5bd" }
};

const ID_MAP = {
  'peru':'peru','costa':'costa','sierra':'sierra','selva':'selva','sea':'sea',
  'other_countries':'other','other':'other'
};

const mapObject = document.getElementById('map-object');
let activeRegions = new Set();
let svgRegions = [];
let svgSymbols = [];

/* Hilfsfunktionen */
function applyFill(el, color){
  if(!el) return;
  el.style.setProperty('fill', color, 'important');
  el.style.setProperty('fill-opacity', '1', 'important');
}
function setState(el,key,state){
  const col = COLORS[key] && COLORS[key][state];
  if(col) applyFill(el, col);
}
function setSymbolVisibility(sym, isVisible) {
  if(isVisible) {
    sym.style.opacity = '1';
    sym.style.pointerEvents = 'auto'; // Muss klickbar sein!
    sym.style.display = 'block';
  } else {
    sym.style.opacity = '0';
    sym.style.pointerEvents = 'none';
  }
}

/* Modal öffnen (Allgemein) */
function openModal(title, text) {
  const c = document.getElementById('term-modal-container');
  c.innerHTML = `
    <div class="modal-backdrop" id="modal-backdrop">
      <div class="modal">
        <h3>${title}</h3>
        <p>${text}</p>
        <button class="close" id="close-term-modal">Schließen</button>
      </div>
    </div>`;
  c.style.display='block';
  
  // Schließen-Logik
  const closeBtn = document.getElementById('close-term-modal');
  const backdrop = document.getElementById('modal-backdrop');
  
  const close = () => { c.innerHTML=''; c.style.display='none'; };
  
  closeBtn.addEventListener('click', close);
  backdrop.addEventListener('click', (e) => { if(e.target === backdrop) close(); });
  document.addEventListener('keydown', function esc(e){ 
    if(e.key==='Escape'){ close(); document.removeEventListener('keydown',esc); } 
  });
}

/* Klick auf Text-Begriffe */
function attachTermHandlers(root){
  if(!root) return;
  root.querySelectorAll('.term-btn').forEach(b=>{
    b.addEventListener('click', (e)=>{ 
      e.preventDefault(); 
      const term = e.currentTarget.dataset.term;
      if(TERMS[term]) openModal(term, TERMS[term]);
    });
  });
}

/* SVG Initialisierung */
function initSvgInteractions(svg){
  if(!svg) return;
  svgRegions = [];
  svgSymbols = [];

  // 1. Regionen
  Object.keys(ID_MAP).forEach(id=>{
    const el = svg.querySelector('#'+id);
    if(!el) return;
    const key = ID_MAP[id];
    el.classList.add('region');
    el.dataset.key = key;
    el.style.cursor = 'pointer';
    setState(el,key,'base');
    svgRegions.push(el);

    el.addEventListener('mouseenter', ()=>{ if(!activeRegions.has(el)) setState(el,key,'hover'); });
    el.addEventListener('mouseleave', ()=>{ if(!activeRegions.has(el)) setState(el,key,'base'); });
    el.addEventListener('click', (ev)=>{
      ev.preventDefault();
      // Einfache Klick-Logik:
      if(ev.ctrlKey){
         if(activeRegions.has(el)) { activeRegions.delete(el); setState(el,key,'base'); }
         else { activeRegions.add(el); setState(el,key,'active'); }
      } else {
        const already = activeRegions.has(el);
        clearSelections();
        if(!already) { activeRegions.add(el); setState(el,key,'active'); }
      }
      updateRightPanel();
    });
  });

  // 2. Symbole verarbeiten
  svgSymbols = Array.from(svg.querySelectorAll('[id^="symbol-"]'));
  
  svgSymbols.forEach(sym => {
    // Initial unsichtbar
    sym.style.opacity = '0'; 
    sym.style.pointerEvents = 'none';
    sym.style.cursor = 'pointer'; // Zeige Hand-Cursor, wenn sichtbar
    sym.style.transition = 'opacity 0.3s ease'; 
    
    // ID Parsen: "symbol-mining-sierra" -> type="mining", region="sierra"
    const idParts = (sym.id || '').split('-');
    // Annahme: Teil 1 ist "symbol", Teil 2 ist der Typ (mining), Rest ist Region
    const type = idParts[1] || 'default';
    const region = idParts.length > 2 ? idParts[idParts.length - 1].toLowerCase().trim() : 'peru';
    
    sym.dataset.region = region;
    sym.dataset.type = type;

    // KLICK AUF SYMBOL -> MODAL ÖFFNEN
    sym.addEventListener('click', (e) => {
      e.stopPropagation(); // Verhindert Klick auf darunterliegende Region
      
      // Nur klicken, wenn sichtbar
      if(sym.style.opacity === '0') return;

      const typeKey = sym.dataset.type;
      const def = SYMBOL_DEFINITIONS[typeKey] || SYMBOL_DEFINITIONS['default'];
      
      openModal(def.title, def.text);
    });
  });
}

function clearSelections(){
  activeRegions.forEach(r=>{
    const k = r.dataset.key || 'peru';
    setState(r,k,'base');
  });
  activeRegions.clear();
}

function updateSymbolsForRegions(keys){
  const activeKeys = Array.isArray(keys) ? keys : [];
  const normalized = activeKeys.map(k => String(k).toLowerCase().trim());

  svgSymbols.forEach(sym => {
    const region = sym.dataset.region;
    if(normalized.includes(region)){
      setSymbolVisibility(sym, true);
    } else {
      setSymbolVisibility(sym, false);
    }
  });
}

/* Laden und Starten */
mapObject.addEventListener('load', ()=>{
  try {
    const svgDoc = mapObject.contentDocument; 
    if(svgDoc) initSvgInteractions(svgDoc.documentElement);
  } catch(e){
    attemptFetchInline();
  }
});

async function attemptFetchInline(){
  try{
    const path = mapObject.getAttribute('data');
    const resp = await fetch(path);
    if(!resp.ok) throw new Error();
    const text = await resp.text();
    const parser = new DOMParser();
    const doc = parser.parseFromString(text,'image/svg+xml');
    mapObject.replaceWith(doc.documentElement);
    initSvgInteractions(doc.documentElement);
  } catch(err){}
}

/* Panel füllen */
function updateRightPanel(){
  const keysInOrder = Array.from(activeRegions).map(el => el.dataset.key).filter(Boolean);
  const uniqueKeys = Array.from(new Set(keysInOrder));

  updateSymbolsForRegions(uniqueKeys);

  if(uniqueKeys.length === 0){
    document.getElementById('region-name').textContent = 'Bitte eine Region anklicken (STRG für Mehrfachauswahl)';
    ['facts','nature','society','world','problems'].forEach(id=>document.getElementById(id).innerHTML='—');
    return;
  }
  
  const parts = ['costa','sierra','selva'];
  const hasAllParts = parts.every(p => uniqueKeys.includes(p));
  
  if(uniqueKeys.includes('peru') || hasAllParts){
    fillPanel(REGION_DATA['peru']);
  } else {
    // Kombinierte Ansicht
    const combined = { name:[], facts:[], nature:[], society:[], world:[], problems:[] };
    uniqueKeys.forEach(k => {
      const d = REGION_DATA[k];
      if(d){
        combined.name.push(d.name);
        combined.facts.push(d.facts);
        combined.nature.push(d.nature);
        combined.society.push(d.society);
        combined.world.push(d.world);
        combined.problems.push(d.problems);
      }
    });
    fillPanel({
      name: combined.name.join(' + '),
      facts: combined.facts.join(''),
      nature: combined.nature.join(''),
      society: combined.society.join(''),
      world: combined.world.join(''),
      problems: combined.problems.join('')
    });
  }
}

function fillPanel(data){
  document.getElementById('region-name').textContent = data.name;
  document.getElementById('facts').innerHTML = data.facts;
  document.getElementById('nature').innerHTML = data.nature;
  document.getElementById('society').innerHTML = data.society;
  document.getElementById('world').innerHTML = data.world;
  document.getElementById('problems').innerHTML = data.problems;
  attachTermHandlers(document.getElementById('info-panel'));
}

/* Initiale Handler für Begriffe, die schon da sind (z.B. im Panel) */
document.addEventListener('click',(e)=>{
  if(e.target.classList.contains('term-btn')){
    e.preventDefault();
    const t = e.target.dataset.term;
    if(TERMS[t]) openModal(t, TERMS[t]);
  }
});
</script>
</body>
</html>
