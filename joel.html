<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Peru – Raumanalyse</title>
<style>
  :root{
    --blue:#4dabf7;
    --blue-light:#e7f5ff;
    --sea-base:#e7f8ff;
    --sea-hover:#d0efff;
    --sea-active:#4dabf7;
    --gray-base:#f3f4f6;
    --gray-hover:#e0e3e6;
    --gray-active:#adb5bd;
    --sand:#ffd43b;
    --green:#69db7c;
    --green-light:#d3f9d8;
    --jungle:#2f9e44;
  }

  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--gray-base);color:#222}
  h1{text-align:center;margin:18px 0}
  #layout{display:grid;grid-template-columns:60% 40%;gap:14px;max-width:1200px;margin:auto;padding:14px}
  #map-container,#info-panel{background:#fff;border-radius:12px;padding:14px;box-shadow:0 8px 22px rgba(0,0,0,0.08)}
  object{width:100%;height:640px;border:0;display:block}
  .section{margin-bottom:14px}
  .section h2{margin:0 0 6px;color:var(--blue);font-size:16px}
  .section p,.section li{font-size:14px;line-height:1.45}
  .section ul{padding-left:18px;margin:6px 0 0 0}
  .note{font-style:italic;color:#666}

  /* Buttons im Text */
  .term-btn{
    display:inline-block;border:0;background:transparent;padding:0;margin:0 2px;font-weight:700;color:inherit;cursor:pointer;text-decoration:underline dotted;
  }
  .term-btn:focus{outline:2px solid rgba(0,0,0,0.08);border-radius:3px}

  /* MODAL (Popup) */
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;z-index:9999}
  .modal{background:#fff;border-radius:10px;padding:24px;max-width:500px;width:90%;box-shadow:0 14px 40px rgba(0,0,0,0.25); animation: fadeIn 0.2s ease-out;}
  .modal h3{margin:0 0 12px; color: var(--blue); font-size: 1.4rem; border-bottom: 2px solid var(--gray-base); padding-bottom: 8px;}
  .modal p{margin:0 0 16px; line-height: 1.6; color: #444;}
  .modal .close{display:inline-block;padding:10px 20px;border-radius:6px;background:var(--blue);color:#fff;border:0;cursor:pointer;font-weight:bold;font-size:14px;}
  .modal .close:hover{background:#3b8dc4;}

  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  footer{font-size:12px;color:#666;margin-top:8px}
  @media (max-width:900px){#layout{grid-template-columns:1fr} object{height:520px}}
</style>
</head>
<body>
<h1>Peru – Raumanalyse</h1>

<div id="layout">
  <div id="map-container">
    <object id="map-object" data="map.svg" type="image/svg+xml"></object>
  </div>

  <div id="info-panel">
    <div class="section">
      <h2>Region</h2>
      <p id="region-name" class="note">Bitte eine Region anklicken (STRG für Mehrfachauswahl)</p>
    </div>

    <div class="section">
      <h2>Fakten</h2>
      <div id="facts">—</div>
    </div>

    <div class="section">
      <h2>Naturraum & Entwicklung</h2>
      <div id="nature">—</div>
    </div>

    <div class="section">
      <h2>Gesellschaft & Politik</h2>
      <div id="society">—</div>
    </div>

    <div class="section">
      <h2>Weltwirtschaft</h2>
      <div id="world">—</div>
    </div>

    <div class="section">
      <h2>Disparitäten & Probleme</h2>
      <div id="problems">—</div>
    </div>

    <footer>Projekt: Raumanalyse Peru von Lasse, Leon, Lille und Mark</footer>
  </div>
</div>

<div id="term-modal-container" style="display:none"></div>

<script>
/* ============================================================
   1. BEGRIFFE (Glossar)
   ============================================================ */
const TERMS = {
  "Bad Governance": "Schlechte Regierungsführung: Ineffiziente Institutionen, fehlende Transparenz und mangelnde Rechtsstaatlichkeit.",
  "Korruption": "Missbrauch anvertrauter Macht zum privaten Vorteil. In Peru ein großes Hemmnis für Entwicklungsprojekte.",
  "Subsistenzwirtschaft": "Produktion fast ausschließlich für den Eigenbedarf (Selbstversorgung) ohne nennenswerten Verkauf am Markt.",
  "Terms of Trade": "Verhältnis von Export- zu Importpreisen. Rohstoffexporteure müssen oft immer mehr exportieren, um gleiche Importmengen zu finanzieren.",
  "Fragmentierung": "Starke räumliche und soziale Abkopplung verschiedener Landesteile (z. B. Küste vs. Hochland).",
  "Landflucht": "Massive Abwanderung aus ländlichen Gebieten (Sierra/Selva) in die Küstenstädte auf der Suche nach Arbeit."
};

/* ============================================================
   2. SYMBOL-DEFINITIONEN (Deine 10 Symbole)
   Die Keys entsprechen dem Mittelteil deiner ID: symbol-[KEY]-region
   ============================================================ */
const SYMBOL_DEFINITIONS = {
  // COSTA
  "city": {
    title: "Metropole / Bevölkerungszentrum",
    text: "Lima ist das unangefochtene Zentrum (Primatstadt) des Landes. Hier konzentrieren sich Wirtschaft, Politik und ein Großteil der Bevölkerung, was zu enormem Druck auf die Infrastruktur führt."
  },
  "agriculture-export": {
    title: "Export-Landwirtschaft",
    text: "In den Küstentälern werden mit künstlicher Bewässerung Produkte für den Weltmarkt angebaut (z. B. Spargel, Blaubeeren, Avocados). Dies bringt Devisen, verbraucht aber viel Wasser."
  },
  "export-port": {
    title: "Welthandel & Exporthäfen",
    text: "Über die Häfen (vor allem Callao) werden Rohstoffe und Agrargüter verschifft. Die Küste ist das 'Tor zur Welt' für die peruanische Wirtschaft."
  },
  
  // SIERRA
  "mining": {
    title: "Bergbau (Rohstoffe)",
    text: "Die Anden sind reich an Bodenschätzen (Kupfer, Gold, Zink). Der Bergbau ist der wichtigste Devisenbringer, führt aber oft zu Konflikten um Wasser und Landrechte mit der lokalen Bevölkerung."
  },
  "subsistence": {
    title: "Subsistenzwirtschaft",
    text: "Viele Kleinbauern im Hochland produzieren nur für den Eigenbedarf (Kartoffeln, Mais). Es fehlt an Marktzugang und modernen Technologien."
  },
  "natural-hazards": {
    title: "Naturgefahren",
    text: "Das steile Terrain der Anden birgt Risiken wie Erdbeben und Erdrutsche, die Verkehrswege zerstören und die Entwicklung hemmen können."
  },

  // SELVA
  "rainforest": {
    title: "Tropischer Regenwald",
    text: "Die Selva ist ein riesiger Kohlenstoffspeicher und Biodiversitäts-Hotspot. Sie ist schwer zugänglich, was wirtschaftliche Erschließung erschwert, aber den Naturschutz begünstigt."
  },
  "deforestation": {
    title: "Abholzung & Landnutzungskonflikte",
    text: "Illegale Holzfällerei, Goldgräberei und die Ausweitung von Agrarflächen bedrohen den Regenwald und zerstören den Lebensraum indigener Gemeinschaften."
  },
  "infrastructure-weak": {
    title: "Mangelnde Infrastruktur",
    text: "Es fehlen befestigte Straßen und Brücken. Viele Gebiete sind nur per Boot oder Flugzeug erreichbar, was Bildung und Gesundheitsversorgung erschwert."
  },

  // PERU (Gesamt)
  "corruption": {
    title: "Korruption & Instabilität",
    text: "Politische Instabilität und Korruption auf nationaler Ebene verhindern oft langfristige Planungen und sorgen dafür, dass Einnahmen aus Rohstoffen nicht bei der Bevölkerung ankommen."
  },

  // Fallback
  "default": {
    title: "Raumanalyse Symbol",
    text: "Wichtiger Standortfaktor für diese Region."
  }
};

/* ============================================================
   3. REGIONEN DATEN (Texte für das Panel)
   ============================================================ */
const REGION_DATA = {
  peru: {
    name: "Peru (Gesamt)",
    facts: `<ul><li><strong>Einwohner:</strong> ca. 34 Mio.</li><li><strong>BIP:</strong> Exportabhängig (Bergbau).</li></ul>`,
    nature: `<ul><li>Extreme Dreiteilung: Wüste, Hochgebirge, Regenwald.</li></ul>`,
    society: `<ul><li>Hohe Ungleichheit (Gini-Index).</li><li>Multikulturell, aber rassistische Strukturen.</li></ul>`,
    world: `<ul><li>Rohstofflieferant für China, USA, EU.</li></ul>`,
    problems: `<ul><li><button class="term-btn" data-term="Korruption">Korruption</button> und politische Instabilität.</li><li>Abhängigkeit von Weltmarktpreisen (<button class="term-btn" data-term="Terms of Trade">Terms of Trade</button>).</li></ul>`
  },
  costa: {
    name: "Costa (Küste)",
    facts: `<ul><li>Wirtschaftliches Herz Perus.</li><li>Beherbergt über 50% der Bevölkerung auf nur 11% der Fläche.</li></ul>`,
    nature: `<ul><li>Arides Wüstenklima (Humboldtstrom).</li><li>Wasser ist knappe Ressource.</li></ul>`,
    society: `<ul><li>Starke Urbanisierung, Slums an Stadträndern.</li><li>Ziel von <button class="term-btn" data-term="Landflucht">Landflucht</button>.</li></ul>`,
    world: `<ul><li>Agrarexporte & Logistikdrehscheibe.</li></ul>`,
    problems: `<ul><li>Wassermangel, Luftverschmutzung, Verkehrschaos.</li></ul>`
  },
  sierra: {
    name: "Sierra (Anden)",
    facts: `<ul><li>Traditioneller Siedlungsraum, heute oft Abwanderungsgebiet.</li></ul>`,
    nature: `<ul><li>Hochgebirge, steile Hänge, Erosionsgefahr.</li></ul>`,
    society: `<ul><li>Hoher Anteil indigener Bevölkerung.</li><li>Prägung durch <button class="term-btn" data-term="Subsistenzwirtschaft">Subsistenzwirtschaft</button>.</li></ul>`,
    world: `<ul><li>Quelle der Export-Rohstoffe (Minen).</li></ul>`,
    problems: `<ul><li>Armut, schlechte Infrastruktur, Kälte.</li></ul>`
  },
  selva: {
    name: "Selva (Amazonas)",
    facts: `<ul><li>Größte Naturregion (60% Fläche), geringste Bevölkerung.</li></ul>`,
    nature: `<ul><li>Global wichtiges Ökosystem (Klima).</li></ul>`,
    society: `<ul><li>Indigene Völker, teils isoliert.</li><li>Konflikte um Landrechte.</li></ul>`,
    world: `<ul><li>Interesse an Ressourcen (Öl, Gas, Holz, Gold).</li></ul>`,
    problems: `<ul><li>Raubbau, <button class="term-btn" data-term="Fragmentierung">Fragmentierung</button> von Lebensräumen.</li></ul>`
  },
  sea: {
    name: "Mar Grau (Pazifik)",
    facts:`<ul><li>200-Meilen-Zone.</li></ul>`,
    nature:`<ul><li>Nährstoffreich durch Upwelling.</li></ul>`,
    society:`<ul><li>Fischerei ist Lebensgrundlage vieler Küstenorte.</li></ul>`,
    world:`<ul><li>Weltgrößter Fischmehl-Exporteur.</li></ul>`,
    problems:`<ul><li>Überfischung, El Niño.</li></ul>`
  },
  other: {
    name: "Nachbarländer",
    facts:`<ul><li>Grenzen zu 5 Staaten (EC, CO, BR, BO, CL).</li></ul>`,
    nature:`<ul><li>Grenzüberschreitende Umweltprobleme.</li></ul>`,
    society:`<ul><li>Migration und Grenzhandel.</li></ul>`,
    world:`<ul><li>Geopolitische Lage in Südamerika.</li></ul>`,
    problems:`<ul><li>Schmuggel (Waren, Drogen).</li></ul>`
  }
};

/* ============================================================
   LOGIK & INTERAKTION
   ============================================================ */
const COLORS = {
  costa: { base:"rgba(0,0,0,0.01)", hover:"#fff3bf", active:"#ffd43b" },
  sierra:{ base:"rgba(0,0,0,0.01)", hover:"#d3f9d8", active:"#69db7c" },
  selva: { base:"rgba(0,0,0,0.01)", hover:"#c3fae8", active:"#2f9e44" },
  peru:  { base:"#ffffff", hover:"#e7f5ff", active:"#4dabf7" },
  sea:   { base:"#e7f8ff", hover:"#d0efff", active:"#4dabf7" },
  other: { base:"#f3f4f6", hover:"#e0e3e6", active:"#adb5bd" }
};

const ID_MAP = {
  'peru':'peru','costa':'costa','sierra':'sierra','selva':'selva','sea':'sea',
  'other_countries':'other','other':'other'
};

const mapObject = document.getElementById('map-object');
let activeRegions = new Set();
let svgRegions = [];
let svgSymbols = [];

/* Farben setzen */
function applyFill(el, color){
  if(!el) return;
  el.style.setProperty('fill', color, 'important');
  el.style.setProperty('fill-opacity', '1', 'important');
}
function setState(el,key,state){
  const col = COLORS[key] && COLORS[key][state];
  if(col) applyFill(el, col);
}

/* Symbol Sichtbarkeit steuern */
function setSymbolVisibility(sym, isVisible) {
  if(isVisible) {
    sym.style.opacity = '1';
    sym.style.pointerEvents = 'auto'; // Damit man draufklicken kann
    sym.style.display = 'block';
  } else {
    sym.style.opacity = '0';
    sym.style.pointerEvents = 'none';
  }
}

/* Modal Logik */
function openModal(title, text) {
  const c = document.getElementById('term-modal-container');
  c.innerHTML = `
    <div class="modal-backdrop" id="modal-backdrop">
      <div class="modal">
        <h3>${title}</h3>
        <p>${text}</p>
        <button class="close" id="close-term-modal">Schließen</button>
      </div>
    </div>`;
  c.style.display='block';
  
  const close = () => { c.innerHTML=''; c.style.display='none'; };
  document.getElementById('close-term-modal').addEventListener('click', close);
  document.getElementById('modal-backdrop').addEventListener('click', (e) => { if(e.target.id === 'modal-backdrop') close(); });
  document.addEventListener('keydown', function esc(e){ if(e.key==='Escape'){ close(); document.removeEventListener('keydown',esc); }});
}

/* Panel Handler für Begriffe */
function attachTermHandlers(root){
  if(!root) return;
  root.querySelectorAll('.term-btn').forEach(b=>{
    b.addEventListener('click', (e)=>{ 
      e.preventDefault(); 
      const term = e.currentTarget.dataset.term;
      if(TERMS[term]) openModal(term, TERMS[term]);
    });
  });
}

/* Hauptfunktion: SVG initialisieren */
function initSvgInteractions(svg){
  if(!svg) return;
  svgRegions = [];
  svgSymbols = [];

  // 1. REGIONEN
  Object.keys(ID_MAP).forEach(id=>{
    const el = svg.querySelector('#'+id);
    if(!el) return;
    const key = ID_MAP[id];
    el.classList.add('region');
    el.dataset.key = key;
    el.style.cursor = 'pointer';
    setState(el,key,'base');
    svgRegions.push(el);

    el.addEventListener('mouseenter', ()=>{ if(!activeRegions.has(el)) setState(el,key,'hover'); });
    el.addEventListener('mouseleave', ()=>{ if(!activeRegions.has(el)) setState(el,key,'base'); });
    el.addEventListener('click', (ev)=>{
      ev.preventDefault();
      if(ev.ctrlKey){
         if(activeRegions.has(el)) { activeRegions.delete(el); setState(el,key,'base'); }
         else { activeRegions.add(el); setState(el,key,'active'); }
      } else {
        const already = activeRegions.has(el);
        clearSelections();
        if(!already) { activeRegions.add(el); setState(el,key,'active'); }
      }
      updateRightPanel();
    });
  });

  // 2. SYMBOLE
  // Wir suchen alle Elemente, deren ID mit "symbol-" beginnt
  svgSymbols = Array.from(svg.querySelectorAll('[id^="symbol-"]'));
  
  svgSymbols.forEach(sym => {
    // Initial unsichtbar machen
    sym.style.opacity = '0'; 
    sym.style.pointerEvents = 'none';
    sym.style.cursor = 'pointer';
    sym.style.transition = 'opacity 0.3s ease';

    // ID PARSEN: symbol-[THEMA]-[REGION] (z.B. symbol-export-port-costa)
    const id = sym.id || '';
    const parts = id.split('-'); 
    
    // Wir nehmen an: 'symbol' ist parts[0], Region ist der letzte Teil
    // Alles dazwischen ist das Thema (joined mit '-')
    let region = 'peru';
    let type = 'default';

    if(parts.length >= 3) {
        // Entferne evtl. Nummern aus der Region (z.B. costa1 -> costa)
        region = parts[parts.length - 1].replace(/\d+/g, '').toLowerCase().trim();
        
        // Thema ist alles zwischen Index 1 und dem vorletzten
        const typeParts = parts.slice(1, parts.length - 1);
        type = typeParts.join('-'); // z.B. "export-port"
    }

    sym.dataset.region = region;
    sym.dataset.type = type;

    // KLICK HANDLER FÜR SYMBOL
    sym.addEventListener('click', (e) => {
      e.stopPropagation(); // Stoppt Event, damit Region nicht reagiert
      if(sym.style.opacity === '0') return;

      const def = SYMBOL_DEFINITIONS[sym.dataset.type] || SYMBOL_DEFINITIONS['default'];
      openModal(def.title, def.text);
    });
  });
}

function clearSelections(){
  activeRegions.forEach(r=>{
    const k = r.dataset.key || 'peru';
    setState(r,k,'base');
  });
  activeRegions.clear();
}

function updateSymbolsForRegions(keys){
  const activeKeys = Array.isArray(keys) ? keys : [];
  const normalized = activeKeys.map(k => String(k).toLowerCase().trim());

  svgSymbols.forEach(sym => {
    // Symbol anzeigen, wenn seine Region aktiv ist
    if(normalized.includes(sym.dataset.region)){
      setSymbolVisibility(sym, true);
    } else {
      setSymbolVisibility(sym, false);
    }
  });
}

/* Laden */
mapObject.addEventListener('load', ()=>{
  try {
    const svgDoc = mapObject.contentDocument; 
    if(svgDoc) initSvgInteractions(svgDoc.documentElement);
  } catch(e){ attemptFetchInline(); }
});

async function attemptFetchInline(){
  try{
    const path = mapObject.getAttribute('data');
    const resp = await fetch(path);
    if(!resp.ok) throw new Error();
    const parser = new DOMParser();
    const doc = parser.parseFromString(await resp.text(),'image/svg+xml');
    mapObject.replaceWith(doc.documentElement);
    initSvgInteractions(doc.documentElement);
  } catch(err){}
}

/* Panel Update */
function updateRightPanel(){
  const keysInOrder = Array.from(activeRegions).map(el => el.dataset.key).filter(Boolean);
  const uniqueKeys = Array.from(new Set(keysInOrder));

  updateSymbolsForRegions(uniqueKeys);

  if(uniqueKeys.length === 0){
    document.getElementById('region-name').textContent = 'Bitte eine Region anklicken (STRG für Mehrfachauswahl)';
    ['facts','nature','society','world','problems'].forEach(id=>document.getElementById(id).innerHTML='—');
    return;
  }
  
  const parts = ['costa','sierra','selva'];
  const hasAllParts = parts.every(p => uniqueKeys.includes(p));
  
  if(uniqueKeys.includes('peru') || hasAllParts){
    fillPanel(REGION_DATA['peru']);
  } else {
    // Kombinierter Text
    const combined = { name:[], facts:[], nature:[], society:[], world:[], problems:[] };
    uniqueKeys.forEach(k => {
      const d = REGION_DATA[k];
      if(d){
        combined.name.push(d.name);
        combined.facts.push(d.facts);
        combined.nature.push(d.nature);
        combined.society.push(d.society);
        combined.world.push(d.world);
        combined.problems.push(d.problems);
      }
    });
    fillPanel({
      name: combined.name.join(' + '),
      facts: combined.facts.join(''),
      nature: combined.nature.join(''),
      society: combined.society.join(''),
      world: combined.world.join(''),
      problems: combined.problems.join('')
    });
  }
}

function fillPanel(data){
  document.getElementById('region-name').textContent = data.name;
  document.getElementById('facts').innerHTML = data.facts;
  document.getElementById('nature').innerHTML = data.nature;
  document.getElementById('society').innerHTML = data.society;
  document.getElementById('world').innerHTML = data.world;
  document.getElementById('problems').innerHTML = data.problems;
  attachTermHandlers(document.getElementById('info-panel'));
}

/* Globale Klicks (z.B. Terms die schon geladen sind) */
document.addEventListener('click',(e)=>{
  if(e.target.classList.contains('term-btn')){
    e.preventDefault();
    const t = e.target.dataset.term;
    if(TERMS[t]) openModal(t, TERMS[t]);
  }
});
</script>
</body>
</html>
