<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Peru – Raumanalyse</title>
<style>
  :root{
    --blue:#4dabf7;
    --blue-light:#e7f5ff;
    --sea-base:#e7f8ff;
    --sea-hover:#d0efff;
    --sea-active:#4dabf7;
    --gray-base:#f3f4f6;
    --gray-hover:#e0e3e6;
    --gray-active:#adb5bd;
    --sand:#ffd43b;
    --green:#69db7c;
    --green-light:#d3f9d8;
    --jungle:#2f9e44;
  }

  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--gray-base);color:#222}
  h1{text-align:center;margin:18px 0}
  #layout{display:grid;grid-template-columns:60% 40%;gap:14px;max-width:1200px;margin:auto;padding:14px}
  #map-container,#info-panel{background:#fff;border-radius:12px;padding:14px;box-shadow:0 8px 22px rgba(0,0,0,0.08)}
  object{width:100%;height:640px;border:0;display:block}
  .section{margin-bottom:14px}
  .section h2{margin:0 0 6px;color:var(--blue);font-size:16px}
  .section p,.section li{font-size:14px;line-height:1.45}
  .section ul{padding-left:18px;margin:6px 0 0 0}
  .note{font-style:italic;color:#666}

  /* klickbare begriffe */
  .term-btn{
    display:inline-block;border:0;background:transparent;padding:0;margin:0 2px;font-weight:700;color:inherit;cursor:pointer;text-decoration:underline dotted;
  }
  .term-btn:focus{outline:2px solid rgba(0,0,0,0.08);border-radius:3px}

  /* modal */
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;z-index:9999}
  .modal{background:#fff;border-radius:10px;padding:16px;max-width:720px;width:94%;box-shadow:0 14px 40px rgba(0,0,0,0.25)}
  .modal h3{margin:0 0 8px}
  .modal p{margin:0 0 8px}
  .modal .close{display:inline-block;margin-top:12px;padding:8px 12px;border-radius:8px;background:var(--blue);color:#fff;border:0;cursor:pointer}

  footer{font-size:12px;color:#666;margin-top:8px}
  @media (max-width:900px){#layout{grid-template-columns:1fr} object{height:520px}}
</style>
</head>
<body>
<h1>Peru – Raumanalyse</h1>

<div id="layout">
  <div id="map-container">
    <object id="map-object" data="map.svg" type="image/svg+xml"></object>
  </div>

  <div id="info-panel">
    <div class="section">
      <h2>Region</h2>
      <p id="region-name" class="note">Bitte eine Region anklicken (STRG für Mehrfachauswahl)</p>
    </div>

    <div class="section">
      <h2>Fakten</h2>
      <div id="facts">—</div>
    </div>

    <div class="section">
      <h2>Naturraum & Entwicklung</h2>
      <div id="nature">—</div>
    </div>

    <div class="section">
      <h2>Gesellschaft & Politik</h2>
      <div id="society">—</div>
    </div>

    <div class="section">
      <h2>Weltwirtschaft</h2>
      <div id="world">—</div>
    </div>

    <div class="section">
      <h2>Disparitäten & Probleme</h2>
      <div id="problems">—</div>
    </div>

    <footer>Projekt: Raumanalyse Peru von Lasse, Leon, Lille und Mark</footer>
  </div>
</div>

<div id="term-modal-container" style="display:none"></div>

<script>
/* ============================================================
   DATEN: Begriffe & Regionen
   ============================================================ */
const TERMS = {
  "Bad Governance": "Schlechte Regierungsführung: Staatliche Institutionen funktionieren nicht effizient oder gerecht; es fehlen Transparenz, Rechenschaftspflicht und langfristige Planung.",
  "Korruption": "Das heißt Bestechlichkeit oder Verderbtheit. Korruption ist der Missbrauch anvertrauter Macht zum privaten Vorteil. Dabei werden andere Personen benachteiligt oder geschädigt.",
  "Subsistenzwirtschaft": "Damit bezeichnet man eine Wirtschaftsform in der Landwirtschaft, die nur der Eigenversorgung dient. Sie ist in den Entwicklungsländern verbreitet.",
  "Terms of Trade": "Austauschverhältnis zwischen Preisen von Export- und Importgütern eines Landes; verschlechternde Terms of Trade reduzieren die Kaufkraft der Exporteinnahmen.",
  "Fragmentierung": "Räumliche oder soziale Zersplitterung (z. B. unterschiedliche Infrastruktur und Zugang zu Diensten), die koordinierte Entwicklung erschwert.",
  "Landflucht": "Migration vom ländlichen Raum in städtische Zentren – oft ausgelöst durch fehlende Perspektiven, Arbeitsplätze oder Infrastruktur."
};

const REGION_DATA = {
  peru: {
    name: "Peru (zusammengefasst)",
    facts: `<ul><li><strong>Lage:</strong> West-Südamerika...</li><li><strong>Bevölkerung:</strong> Stark urbanisiert...</li><li><strong>Wirtschaft:</strong> Rohstoffexporte...</li></ul>`,
    nature: `<ul><li>Dreiteilung: <strong>Costa</strong>, <strong>Sierra</strong>, <strong>Selva</strong>.</li><li>Naturrisiken: Erdbeben, Erdrutsche.</li></ul>`,
    society: `<ul><li>Historische Konzentration auf Küste.</li><li>Landflucht und Slumbildung in Städten.</li></ul>`,
    world: `<ul><li>Stark in Welthandel eingebunden (Bergbau, Agrar).</li><li>Risiko: Abhängigkeit von Rohstoffpreisen.</li></ul>`,
    problems: `<ul><li><button class="term-btn" data-term="Bad Governance">Bad Governance</button> und <button class="term-btn" data-term="Korruption">Korruption</button>.</li><li>Abhängigkeit (<button class="term-btn" data-term="Terms of Trade">Terms of Trade</button>).</li></ul>`
  },
  costa: {
    name: "Costa (Küste)",
    facts: `<ul><li>Schmaler Küstenstreifen, trocken.</li><li>Zentrum (Lima).</li></ul>`,
    nature: `<ul><li>Humboldtstrom, Wüstenklima.</li></ul>`,
    society: `<ul><li>Industrie, Dienstleistung, Migration aus Sierra/Selva.</li></ul>`,
    world: `<ul><li>Hafeninfrastruktur, Exportzentren.</li></ul>`,
    problems: `<ul><li>Wasserknappheit, Urbanisierungsprobleme.</li></ul>`
  },
  sierra: {
    name: "Sierra (Anden)",
    facts: `<ul><li>Andenhochland, schwer erreichbar.</li></ul>`,
    nature: `<ul><li>Kühle Klimate, Erosion, steile Hänge.</li></ul>`,
    society: `<ul><li><button class="term-btn" data-term="Subsistenzwirtschaft">Subsistenzwirtschaft</button>, indigene Gemeinschaften.</li></ul>`,
    world: `<ul><li>Bergbau (Export), aber wenig lokale Verarbeitung.</li></ul>`,
    problems: `<ul><li>Mangelnde Infrastruktur, <button class="term-btn" data-term="Landflucht">Landflucht</button>.</li></ul>`
  },
  selva: {
    name: "Selva (Amazonas)",
    facts: `<ul><li>Tropisches Tiefland, Regenwald.</li></ul>`,
    nature: `<ul><li>Biodiversität, Kohlenstoffspeicher.</li></ul>`,
    society: `<ul><li>Geringe Dichte, Konflikte um Landrechte.</li></ul>`,
    world: `<ul><li>Rohstoffe (Holz, Öl), Klimarelevanz.</li></ul>`,
    problems: `<ul><li>Abholzung, illegale Aktivitäten.</li></ul>`
  },
  sea: {
    name: "Meer (Pazifik)",
    facts:`<ul><li>Humboldtstrom = Fischreichtum.</li></ul>`,
    nature:`<ul><li>Basis für Fischerei.</li></ul>`,
    society:`<ul><li>Fischereigemeinden.</li></ul>`,
    world:`<ul><li>Fischmehl-Export.</li></ul>`,
    problems:`<ul><li>Überfischung, El Niño.</li></ul>`
  },
  other: {
    name: "Nachbarländer / Welt",
    facts:`<ul><li>Grenzen zu 5 Staaten.</li></ul>`,
    nature:`<ul><li>Übergangslandschaften.</li></ul>`,
    society:`<ul><li>Grenzhandel.</li></ul>`,
    world:`<ul><li>Internationale Beziehungen.</li></ul>`,
    problems:`<ul><li>Geopolitik, Umweltprobleme.</li></ul>`
  }
};

/* ============================================================
   LOGIK
   ============================================================ */
const COLORS = {
  costa: { base:"rgba(0,0,0,0.01)", hover:"#fff3bf", active:"#ffd43b" },
  sierra:{ base:"rgba(0,0,0,0.01)", hover:"#d3f9d8", active:"#69db7c" },
  selva: { base:"rgba(0,0,0,0.01)", hover:"#c3fae8", active:"#2f9e44" },
  peru:  { base:"#ffffff", hover:"#e7f5ff", active:"#4dabf7" },
  sea:   { base:"#e7f8ff", hover:"#d0efff", active:"#4dabf7" },
  other: { base:"#f3f4f6", hover:"#e0e3e6", active:"#adb5bd" }
};

const ID_MAP = {
  'peru':'peru','costa':'costa','sierra':'sierra','selva':'selva','sea':'sea',
  'other_countries':'other','other':'other'
};

/* Symbol Outline Farben */
const SYMBOL_STROKE = {
  costa:  "#d9480f",
  sierra: "#2b8a3e",
  selva:  "#087f5b",
  peru:   "#1c7ed6" 
};

const mapObject = document.getElementById('map-object');
let activeRegions = new Set();
let svgRegions = [];
let svgSymbols = [];

/* Hilfsfunktion: Farbe setzen */
function applyFill(el, color){
  if(!el) return;
  el.style.setProperty('fill', color, 'important');
  el.style.setProperty('fill-opacity', '1', 'important');
}
function setState(el,key,state){
  const col = COLORS[key] && COLORS[key][state];
  if(col) applyFill(el, col);
}

/* Hilfsfunktion: Symbol-Sichtbarkeit direkt per Style steuern */
function setSymbolVisibility(sym, isVisible) {
  if(isVisible) {
    sym.style.opacity = '1';
    sym.style.pointerEvents = 'auto';
    sym.style.display = 'block'; // Sicherstellung
  } else {
    sym.style.opacity = '0';
    sym.style.pointerEvents = 'none';
    // NICHT display: none setzen, damit Transitionen theoretisch möglich bleiben,
    // aber opacity 0 reicht zum Verstecken.
  }
}

/* Klick auf Region */
function toggleSelect(el){
  const key = el.dataset.key || 'peru';
  if(activeRegions.has(el)){
    activeRegions.delete(el);
    setState(el,key,'base');
  } else {
    activeRegions.add(el);
    setState(el,key,'active');
  }
}
function clearSelections(){
  activeRegions.forEach(r=>{
    const k = r.dataset.key || 'peru';
    setState(r,k,'base');
  });
  activeRegions.clear();
}

/**
 * Symbole updaten
 * keys: Liste der aktiven Regionen (z.B. ['costa'])
 */
function updateSymbolsForRegions(keys){
  const activeKeys = Array.isArray(keys) ? keys : [];
  const normalized = activeKeys.map(k => String(k).toLowerCase().trim());

  svgSymbols.forEach(sym => {
    // Reset Active State (Stroke weg)
    sym.classList.remove('symbol-active');
    sym.querySelectorAll('*').forEach(child => {
      child.style.strokeOpacity = '0';
    });

    const id = sym.id || '';
    const parts = id.split('-');
    // Nimmt den letzten Teil der ID als Region (z.B. mining-sierra -> sierra)
    const region = parts.length > 1 ? parts[parts.length - 1].toLowerCase().trim() : '';

    if(normalized.includes(region)){
      // Übereinstimmung: Zeigen!
      setSymbolVisibility(sym, true);
    } else {
      // Keine Übereinstimmung: Verstecken!
      setSymbolVisibility(sym, false);
    }
  });
}

function initSvgInteractions(svg){
  if(!svg) return;
  svgRegions = [];
  svgSymbols = [];

  // 1. Regionen finden
  Object.keys(ID_MAP).forEach(id=>{
    const el = svg.querySelector('#'+id);
    if(!el) return;
    const key = ID_MAP[id];
    el.classList.add('region');
    el.dataset.key = key;
    el.style.cursor = 'pointer';
    setState(el,key,'base');
    svgRegions.push(el);

    // Events
    el.addEventListener('mouseenter', ()=>{
      if(!activeRegions.has(el)) setState(el,key,'hover');
    });
    el.addEventListener('mouseleave', ()=>{
      if(!activeRegions.has(el)) setState(el,key,'base');
    });
    el.addEventListener('click', (ev)=>{
      ev.preventDefault();
      if(ev.ctrlKey){
         // Mehrfachauswahl logic... (vereinfacht für Lesbarkeit)
         if(activeRegions.has(el)) { activeRegions.delete(el); setState(el,key,'base'); }
         else { activeRegions.add(el); setState(el,key,'active'); }
      } else {
        const already = activeRegions.has(el);
        clearSelections();
        if(!already) { activeRegions.add(el); setState(el,key,'active'); }
      }
      updateRightPanel();
    });
  });

  // 2. Symbole finden & initial verstecken
  // Sucht alles, was mit "symbol-" anfängt
  svgSymbols = Array.from(svg.querySelectorAll('[id^="symbol-"]'));
  
  svgSymbols.forEach(sym => {
    // Initial: Verstecken per JS Style (wichtig!)
    sym.style.opacity = '0'; 
    sym.style.pointerEvents = 'none';
    sym.style.transition = 'opacity 0.3s ease'; // Schöner Übergang
    
    // Unterelemente stroke resetten
    sym.querySelectorAll('*').forEach(child => {
      child.style.transition = 'stroke-opacity 0.2s, stroke 0.2s';
      child.style.strokeOpacity = '0';
    });

    // ID parsen für Farbe
    const id = sym.id || '';
    const parts = id.split('-');
    const region = parts.length > 1 ? parts[parts.length - 1].toLowerCase().trim() : 'peru';
    sym.dataset.region = region;

    // Klick auf Symbol
    sym.addEventListener('click', (e) => {
      e.stopPropagation(); // Nicht auf Region durchklicken
      if(sym.style.opacity === '0') return; // Sicher ist sicher

      // Toggle Active State
      const isActive = sym.classList.contains('symbol-active');
      // Andere deaktivieren
      svgSymbols.forEach(s => {
        s.classList.remove('symbol-active');
        s.querySelectorAll('*').forEach(c => c.style.strokeOpacity = '0');
      });

      if(!isActive){
        sym.classList.add('symbol-active');
        const col = SYMBOL_STROKE[region] || '#333';
        sym.querySelectorAll('*').forEach(c => {
          c.style.stroke = col;
          c.style.strokeOpacity = '1';
        });
      }
    });
  });
}

/* Laden der SVG */
mapObject.addEventListener('load', ()=>{
  try {
    const svgDoc = mapObject.contentDocument; 
    if(svgDoc){
      initSvgInteractions(svgDoc.documentElement);
    }
  } catch(e){
    console.log("Kann SVG nicht direkt lesen (CORS?), versuche Inline-Fetch...");
    attemptFetchInline();
  }
});

/* Fallback falls Object-Zugriff blockiert */
async function attemptFetchInline(){
  try{
    const path = mapObject.getAttribute('data') || 'map.svg';
    const resp = await fetch(path);
    if(!resp.ok) throw new Error('Status '+resp.status);
    const text = await resp.text();
    const parser = new DOMParser();
    const doc = parser.parseFromString(text,'image/svg+xml');
    const svgEl = doc.documentElement;
    mapObject.replaceWith(svgEl);
    initSvgInteractions(svgEl);
  } catch(err){
    console.error(err);
  }
}

/* Panel Update */
function updateRightPanel(){
  const keysInOrder = Array.from(activeRegions).map(el => el.dataset.key).filter(Boolean);
  const uniqueKeys = Array.from(new Set(keysInOrder));

  // 1. Symbole aktualisieren
  updateSymbolsForRegions(uniqueKeys);

  // 2. Texte aktualisieren
  if(uniqueKeys.length === 0){
    document.getElementById('region-name').textContent = 'Bitte eine Region anklicken (STRG für Mehrfachauswahl)';
    ['facts','nature','society','world','problems'].forEach(id=>document.getElementById(id).innerHTML='—');
    return;
  }
  
  // Prüfen ob Peru komplett
  const parts = ['costa','sierra','selva'];
  const hasAllParts = parts.every(p => uniqueKeys.includes(p));
  
  if(uniqueKeys.includes('peru') || hasAllParts){
    const d = REGION_DATA['peru'];
    fillPanel(d);
  } else {
    // Mischtext bauen
    const combined = { name:[], facts:[], nature:[], society:[], world:[], problems:[] };
    uniqueKeys.forEach(k => {
      const d = REGION_DATA[k];
      if(d){
        combined.name.push(d.name);
        combined.facts.push(d.facts);
        combined.nature.push(d.nature);
        combined.society.push(d.society);
        combined.world.push(d.world);
        combined.problems.push(d.problems);
      }
    });
    fillPanel({
      name: combined.name.join(' + '),
      facts: combined.facts.join(''),
      nature: combined.nature.join(''),
      society: combined.society.join(''),
      world: combined.world.join(''),
      problems: combined.problems.join('')
    });
  }
}

function fillPanel(data){
  document.getElementById('region-name').textContent = data.name;
  document.getElementById('facts').innerHTML = data.facts;
  document.getElementById('nature').innerHTML = data.nature;
  document.getElementById('society').innerHTML = data.society;
  document.getElementById('world').innerHTML = data.world;
  document.getElementById('problems').innerHTML = data.problems;
  attachTermHandlers(document.getElementById('info-panel'));
}

/* Modal Funktionen */
function showTermModal(term){
  const def = TERMS[term];
  if(!def) return;
  const c = document.getElementById('term-modal-container');
  c.innerHTML = `<div class="modal-backdrop"><div class="modal"><h3>${term}</h3><p>${def}</p><button class="close" id="close-term-modal">Schließen</button></div></div>`;
  c.style.display='block';
  document.getElementById('close-term-modal').addEventListener('click', ()=>{ c.innerHTML=''; c.style.display='none'; });
}
function attachTermHandlers(root){
  if(!root) return;
  root.querySelectorAll('.term-btn').forEach(b=>{
    b.addEventListener('click', (e)=>{ e.preventDefault(); showTermModal(e.currentTarget.dataset.term); });
  });
}
document.addEventListener('click',(e)=>{
  const btn = e.target.closest('.term-btn');
  if(btn) { e.preventDefault(); showTermModal(btn.dataset.term); }
});
</script>
</body>
</html>
