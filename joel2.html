<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Raumanalyse Peru – Interaktive Karte</title>

  <style>
    /* ==============================
       GRUNDLAYOUT
    ============================== */

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      height: 100vh;
      background: #f4f6f8;
      color: #222;
    }

    #map-container {
      width: 60%;
      border-right: 2px solid #ccc;
      background: #fff;
    }

    #info {
      width: 40%;
      padding: 20px 24px;
      overflow-y: auto;
    }

    #info h2 {
      margin-top: 0;
      font-size: 24px;
    }

    #info p {
      line-height: 1.6;
    }

    #info ul {
      margin-left: 18px;
    }

    #info li {
      margin-bottom: 6px;
    }

    /* ==============================
       SYMBOL-STEUERUNG
    ============================== */

    .symbol-hidden {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .symbol-visible {
      opacity: 1;
      pointer-events: auto;
      cursor: pointer;
      transition: opacity 0.25s ease;
    }

    .symbol-visible:hover path,
    .symbol-visible:hover rect,
    .symbol-visible:hover circle,
    .symbol-visible:hover polygon,
    .symbol-visible:hover line {
      stroke-opacity: 1;
      stroke-width: 2;
    }

    /* ==============================
       REGIONS-HOVER (optional)
    ============================== */

    .region-hover {
      filter: brightness(0.9);
    }
  </style>
</head>

<body>

  <!-- ==============================
       KARTE
  ============================== -->
  <div id="map-container">
    <object
      id="peru-svg"
      data="map.svg"
      type="image/svg+xml"
      width="100%"
      height="100%">
    </object>
  </div>

  <!-- ==============================
       INFOBEREICH
  ============================== -->
  <div id="info">
    <h2 id="info-title">Peru – Raumanalyse</h2>
    <p id="info-text">
      Klicke auf eine Region oder ein Symbol, um eine fachliche Erklärung zu erhalten.
    </p>
  </div>

  <!-- ==============================
       JAVASCRIPT
  ============================== -->
  <script>
    const svgObject = document.getElementById("peru-svg");

    svgObject.addEventListener("load", () => {
      const svgDoc = svgObject.contentDocument;

      if (!svgDoc) {
        console.error("SVG konnte nicht geladen werden.");
        return;
      }

      /* ==============================
         REGIONEN
      ============================== */
      const regions = {
        peru: svgDoc.getElementById("peru"),
        costa: svgDoc.getElementById("costa"),
        sierra: svgDoc.getElementById("sierra"),
        selva: svgDoc.getElementById("selva")
      };

      /* ==============================
         SYMBOLE
      ============================== */
      const symbols = Array.from(
        svgDoc.querySelectorAll('[id^="symbol-"]')
      );

      /* ==============================
         FARBEN (einheitlich)
      ============================== */
      symbols.forEach(sym => {
        sym.classList.add("symbol-hidden");

        sym.querySelectorAll("*").forEach(el => {
          el.style.fill = "#333";
          el.style.stroke = "#1a4fa3";
          el.style.strokeOpacity = "0";
        });
      });

      /* ==============================
         DATEN: REGIONEN
      ============================== */
      const REGION_DATA = {
        peru: {
          title: "Peru – Gesamtstaat",
          html: `
            <p>
              Peru ist ein Staat mit sehr starken regionalen Gegensätzen.
              Diese Unterschiede beeinflussen Wirtschaft, Bevölkerung,
              Infrastruktur und Entwicklungsmöglichkeiten erheblich.
            </p>
            <ul>
              <li>Starke Konzentration von Macht und Kapital in Lima</li>
              <li>Große soziale und wirtschaftliche Disparitäten</li>
              <li>Abhängigkeit von Rohstoffexporten</li>
              <li>Politische Instabilität und Korruption als Entwicklungshemmnisse</li>
            </ul>
          `
        },
        costa: {
          title: "Costa – Küstenregion",
          html: `
            <p>
              Die Costa ist das wirtschaftliche Zentrum Perus.
              Trotz des trockenen Klimas ist sie die am dichtesten besiedelte Region.
            </p>
            <ul>
              <li>Lima als Metropole und politisches Zentrum</li>
              <li>Häfen als Schnittstelle zum Weltmarkt</li>
              <li>Exportorientierte Landwirtschaft durch Bewässerung</li>
            </ul>
          `
        },
        sierra: {
          title: "Sierra – Anden",
          html: `
            <p>
              Die Sierra ist geprägt durch Hochgebirge, schwierige Lebensbedingungen
              und eine starke Abhängigkeit vom Bergbau.
            </p>
            <ul>
              <li>Rohstoffabbau (Kupfer, Silber, Zink)</li>
              <li>Subsistenzwirtschaft im Hochland</li>
              <li>Hohe Anfälligkeit für Naturgefahren</li>
            </ul>
          `
        },
        selva: {
          title: "Selva – Amazonasgebiet",
          html: `
            <p>
              Die Selva ist dünn besiedelt, schwer zugänglich und ökologisch sehr wertvoll.
              Gleichzeitig steht sie unter starkem Nutzungsdruck.
            </p>
            <ul>
              <li>Dichter Regenwald</li>
              <li>Abholzung und Ressourcenausbeutung</li>
              <li>Große Infrastrukturdefizite</li>
            </ul>
          `
        }
      };

      /* ==============================
         DATEN: SYMBOLE
      ============================== */
      const SYMBOL_DATA = {
        "symbol-city-costa": {
          title: "Metropole / Bevölkerungszentrum",
          html: `
            <p>
              Lima ist das wirtschaftliche, politische und demografische Zentrum Perus.
            </p>
            <ul>
              <li>Hohe Bevölkerungsdichte</li>
              <li>Viele Arbeitsplätze im Dienstleistungssektor</li>
              <li>Starke Binnenmigration</li>
            </ul>
          `
        },

        "symbol-agriculture-export-costa": {
          title: "Exportorientierte Landwirtschaft",
          html: `
            <p>
              Durch Bewässerungsprojekte ist intensive Landwirtschaft in der Wüste möglich.
            </p>
            <ul>
              <li>Spargel, Avocados, Blaubeeren</li>
              <li>Produktion für den Weltmarkt</li>
              <li>Ungleiche Landverteilung</li>
            </ul>
          `
        },

        "symbol-export-port-costa": {
          title: "Häfen & Export",
          html: `
            <p>
              Häfen verbinden Peru mit dem Weltmarkt.
            </p>
            <ul>
              <li>Export von Rohstoffen</li>
              <li>Export von Agrarprodukten</li>
              <li>Starke Abhängigkeit vom Welthandel</li>
            </ul>
          `
        },

        "symbol-mining-sierra": {
          title: "Bergbau",
          html: `
            <p>
              Der Bergbau ist einer der wichtigsten Wirtschaftszweige Perus.
            </p>
            <ul>
              <li>Kupfer, Silber, Zink</li>
              <li>Umweltbelastungen</li>
              <li>Konflikte mit lokaler Bevölkerung</li>
            </ul>
          `
        },

        "symbol-subsistence-sierra": {
          title: "Subsistenzwirtschaft",
          html: `
            <p>
              Viele Menschen wirtschaften hauptsächlich für den Eigenbedarf.
            </p>
            <ul>
              <li>Geringe Produktivität</li>
              <li>Kaum Marktanbindung</li>
              <li>Armut im Hochland</li>
            </ul>
          `
        },

        "symbol-natural-hazards-sierra": {
          title: "Naturgefahren",
          html: `
            <p>
              Die Andenregion ist stark von Naturgefahren betroffen.
            </p>
            <ul>
              <li>Erdbeben</li>
              <li>Erdrutsche</li>
              <li>Hemmnis für Entwicklung</li>
            </ul>
          `
        },

        "symbol-rainforest-selva": {
          title: "Regenwald",
          html: `
            <p>
              Der Amazonasregenwald ist ökologisch extrem wertvoll.
            </p>
            <ul>
              <li>Hohe Biodiversität</li>
              <li>Klimarelevanz</li>
              <li>Schwer zugänglich</li>
            </ul>
          `
        },

        "symbol-deforestation-selva": {
          title: "Abholzung",
          html: `
            <p>
              Die Abholzung bedroht Umwelt und indigene Lebensräume.
            </p>
            <ul>
              <li>Holzgewinnung</li>
              <li>Landgewinnung</li>
              <li>Ökologische Schäden</li>
            </ul>
          `
        },

        "symbol-infrastructure-weak-selva": {
          title: "Schwache Infrastruktur",
          html: `
            <p>
              Fehlende Infrastruktur erschwert Entwicklung.
            </p>
            <ul>
              <li>Kaum Straßen</li>
              <li>Schlechte Versorgung</li>
              <li>Isolation vieler Gebiete</li>
            </ul>
          `
        },

        "symbol-corruption-peru": {
          title: "Korruption & Instabilität",
          html: `
            <p>
              Korruption schwächt staatliche Strukturen.
            </p>
            <ul>
              <li>Fehlverwendung öffentlicher Gelder</li>
              <li>Geringes Vertrauen in Politik</li>
              <li>Entwicklungshemmnis</li>
            </ul>
          `
        }
      };

      /* ==============================
         FUNKTIONEN
      ============================== */
      function hideAllSymbols() {
        symbols.forEach(sym => {
          sym.classList.remove("symbol-visible");
          sym.classList.add("symbol-hidden");
        });
      }

      function showSymbolsForRegion(region) {
        hideAllSymbols();
        symbols.forEach(sym => {
          if (sym.id.endsWith("-" + region)) {
            sym.classList.remove("symbol-hidden");
            sym.classList.add("symbol-visible");
          }
        });
      }

      function setInfo(title, html) {
        document.getElementById("info-title").textContent = title;
        document.getElementById("info-text").innerHTML = html;
      }

      /* ==============================
         REGION-KLICKS
      ============================== */
      Object.entries(regions).forEach(([name, el]) => {
        if (!el) return;

        el.style.cursor = "pointer";

        el.addEventListener("click", () => {
          showSymbolsForRegion(name);
          setInfo(REGION_DATA[name].title, REGION_DATA[name].html);
        });
      });

      /* ==============================
         SYMBOL-KLICKS
      ============================== */
      symbols.forEach(sym => {
        sym.addEventListener("click", (e) => {
          e.stopPropagation();
          const data = SYMBOL_DATA[sym.id];
          if (data) {
            setInfo(data.title, data.html);
          }
        });
      });
    });
  </script>

</body>
</html>
