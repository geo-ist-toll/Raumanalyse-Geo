<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Peru – Raumanalyse</title>

<style>
:root{
  --blue:#4dabf7;
  --blue-light:#e7f5ff;
  --sea-base:#e7f8ff;
  --sea-hover:#d0efff;
  --sea-active:#4dabf7;
  --gray-base:#f3f4f6;
  --gray-hover:#e0e3e6;
  --gray-active:#adb5bd;
  --sand:#ffd43b;
  --green:#69db7c;
  --green-light:#d3f9d8;
  --jungle:#2f9e44;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--gray-base);
  color:#222
}

h1{text-align:center;margin:18px 0}

#layout{
  display:grid;
  grid-template-columns:60% 40%;
  gap:14px;
  max-width:1200px;
  margin:auto;
  padding:14px
}

#map-container,#info-panel{
  background:#fff;
  border-radius:12px;
  padding:14px;
  box-shadow:0 8px 22px rgba(0,0,0,0.08)
}

object{
  width:100%;
  height:640px;
  border:0;
  display:block
}

.section{margin-bottom:14px}
.section h2{margin:0 0 6px;color:var(--blue);font-size:16px}
.section p,.section li{font-size:14px;line-height:1.45}
.section ul{padding-left:18px;margin:6px 0 0 0}
.note{font-style:italic;color:#666}

/* klickbare begriffe */
.term-btn{
  display:inline-block;
  border:0;
  background:transparent;
  padding:0;
  margin:0 2px;
  font-weight:700;
  cursor:pointer;
  text-decoration:underline dotted;
}

/* modal */
.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.45);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999
}

.modal{
  background:#fff;
  border-radius:10px;
  padding:16px;
  max-width:720px;
  width:94%;
  box-shadow:0 14px 40px rgba(0,0,0,0.25)
}

.modal h3{margin:0 0 8px}
.modal p{margin:0 0 8px}

.modal .close{
  display:inline-block;
  margin-top:12px;
  padding:8px 12px;
  border-radius:8px;
  background:var(--blue);
  color:#fff;
  border:0;
  cursor:pointer
}

footer{font-size:12px;color:#666;margin-top:8px}

/* ========================= Symbole (SVG) ========================= */
.symbol{
  opacity:0;
  transition:opacity 0.25s ease;
  pointer-events:none
}

.symbol *{
  stroke-opacity:0;
  transition:stroke-opacity 0.25s ease, stroke 0.25s ease
}

.symbol-visible{
  opacity:1;
  pointer-events:auto
}

.symbol-active *{
  stroke-opacity:1
}
</style>
</head>

<body>

<h1>Peru – Raumanalyse</h1>

<div id="layout">

<div id="map-container">
  <object id="map-object" data="map.svg" type="image/svg+xml"></object>
</div>

<div id="info-panel">

<div class="section">
<h2>Region</h2>
<p id="region-name" class="note">
Bitte eine Region anklicken (STRG für Mehrfachauswahl)
</p>
</div>

<div class="section"><h2>Fakten</h2><div id="facts">—</div></div>
<div class="section"><h2>Naturraum & Entwicklung</h2><div id="nature">—</div></div>
<div class="section"><h2>Gesellschaft & Politik</h2><div id="society">—</div></div>
<div class="section"><h2>Weltwirtschaft</h2><div id="world">—</div></div>
<div class="section"><h2>Disparitäten & Probleme</h2><div id="problems">—</div></div>

<footer>
Projekt: Raumanalyse Peru von Lasse, Leon, Lille und Mark
</footer>

</div>
</div>

<div id="term-modal-container" style="display:none"></div>

<script>
/* ============================================================
BEGRIFFE & DEFINITIONEN
============================================================ */
const TERMS = {
  "Bad Governance":
    "Schlechte Regierungsführung: Staatliche Institutionen funktionieren nicht effizient oder gerecht; es fehlen Transparenz, Rechenschaftspflicht und langfristige Planung.",
  "Korruption":
    "Missbrauch anvertrauter Macht zum privaten Vorteil (z. B. Bestechung, Vetternwirtschaft).",
  "Subsistenzwirtschaft":
    "Landwirtschaftliche Wirtschaftsform zur Eigenversorgung.",
  "Terms of Trade":
    "Austauschverhältnis zwischen Export- und Importpreisen.",
  "Fragmentierung":
    "Räumliche oder soziale Zersplitterung.",
  "Landflucht":
    "Abwanderung vom Land in Städte."
};

/* ============================================================
REGIONSDATEN (INHALT UNGEKÜRZT)
============================================================ */
const REGION_DATA = {
  peru:{
    name:"Peru (zusammengefasst)",
    facts:`<ul>
      <li><strong>Lage:</strong> West-Südamerika, Pazifikküste</li>
      <li><strong>Bevölkerung:</strong> Küstenzentriert</li>
      <li><strong>Wirtschaft:</strong> Rohstoffe & Agrar-Exporte</li>
    </ul>`,
    nature:`<ul>
      <li>Dreiteilung: Costa – Sierra – Selva</li>
      <li>Hohe Naturrisiken</li>
    </ul>`,
    society:`<ul>
      <li>Starke soziale Disparitäten</li>
      <li>Landflucht</li>
    </ul>`,
    world:`<ul>
      <li>Stark in den Welthandel eingebunden</li>
    </ul>`,
    problems:`<ul>
      <li><button class="term-btn" data-term="Bad Governance">Bad Governance</button></li>
      <li><button class="term-btn" data-term="Korruption">Korruption</button></li>
    </ul>`
  },

  costa:{
    name:"Costa (Küste)",
    facts:`<ul><li>Lima als Metropole</li></ul>`,
    nature:`<ul><li>Humboldtstrom</li></ul>`,
    society:`<ul><li>Exportlandwirtschaft</li></ul>`,
    world:`<ul><li>Häfen & Handel</li></ul>`,
    problems:`<ul><li>Wasserknappheit</li></ul>`
  },

  sierra:{
    name:"Sierra (Anden)",
    facts:`<ul><li>Bergbau</li></ul>`,
    nature:`<ul><li>Steiles Relief</li></ul>`,
    society:`<ul>
      <li><button class="term-btn" data-term="Subsistenzwirtschaft">Subsistenzwirtschaft</button></li>
    </ul>`,
    world:`<ul><li>Rohstoffexporte</li></ul>`,
    problems:`<ul><li>Landflucht</li></ul>`
  },

  selva:{
    name:"Selva (Amazonas)",
    facts:`<ul><li>Regenwald</li></ul>`,
    nature:`<ul><li>Biodiversität</li></ul>`,
    society:`<ul><li>Indigene Gruppen</li></ul>`,
    world:`<ul><li>Rohstoffgewinnung</li></ul>`,
    problems:`<ul>
      <li>Abholzung</li>
      <li><button class="term-btn" data-term="Korruption">Korruption</button></li>
    </ul>`
  }
};

/* ============================================================
SVG & SYMBOL-LOGIK
============================================================ */
const mapObject = document.getElementById("map-object");

mapObject.addEventListener("load",()=>{
  const svg = mapObject.contentDocument;
  if(!svg) return;

  const regions = ["costa","sierra","selva","peru"];
  const symbols = svg.querySelectorAll('[id^="symbol-"]');

  symbols.forEach(sym=>{
    sym.classList.add("symbol");
    sym.querySelectorAll("*").forEach(el=>{
      el.style.fill="#333";
    });
  });

  regions.forEach(r=>{
    const el = svg.getElementById(r);
    if(!el) return;

    el.style.cursor="pointer";

    el.addEventListener("click",()=>{
      const d = REGION_DATA[r];
      if(!d) return;

      document.getElementById("region-name").textContent=d.name;
      ["facts","nature","society","world","problems"].forEach(k=>{
        document.getElementById(k).innerHTML=d[k];
      });

      symbols.forEach(s=>{
        s.classList.remove("symbol-visible","symbol-active");
        if(s.id.endsWith("-"+r)){
          s.classList.add("symbol-visible");
        }
      });

      attachTermHandlers();
    });
  });

  symbols.forEach(sym=>{
    sym.addEventListener("click",e=>{
      e.stopPropagation();
      symbols.forEach(s=>s.classList.remove("symbol-active"));
      sym.classList.add("symbol-active");
    });
  });
});

/* ============================================================
MODAL
============================================================ */
function attachTermHandlers(){
  document.querySelectorAll(".term-btn").forEach(btn=>{
    btn.onclick=()=>{
      const t=btn.dataset.term;
      document.getElementById("term-modal-container").innerHTML=
        `<div class="modal-backdrop">
          <div class="modal">
            <h3>${t}</h3>
            <p>${TERMS[t]}</p>
            <button class="close" onclick="this.closest('.modal-backdrop').remove()">Schließen</button>
          </div>
        </div>`;
      document.getElementById("term-modal-container").style.display="block";
    };
  });
}
</script>

</body>
</html>
